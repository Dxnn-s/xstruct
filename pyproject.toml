[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xstruct"
version = "0.1.0"
description = "Venue-agnostic market-making and microstructure toolkit for prediction markets and derivatives order books."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["xstruct*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
